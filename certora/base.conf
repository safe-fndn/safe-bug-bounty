// Options shared by every conf in `certora/conf/` (via `override_base_config`).
// Kept outside `certora/conf/` so that CI does not run it on its own.
{
    // The harness imports `contracts/BountyBond.vy` as a module and adds the
    // views that the specs need.
    "files": [
        "certora/harness/BountyBondHarness.vy",
        "certora/harness/Token.vy",
    ],
    "resolve_vyper_imports": true,
    // Everything is Vyper. Without a compiler map the CLI insists on a `solc`
    // in `PATH`.
    "compiler_map": {
        "**/*.vy": "vyper",
    },
    // `computeSubmissionHash` hashes the email and subject, which can be up
    // to `MAX_SUBJECT_LENGTH` (1024) bytes long; the default bound (224
    // bytes) is too small for them.
    "hashing_length_bound": "1024",
    "rule_sanity": "basic",
    "wait_for_results": "all",
}
